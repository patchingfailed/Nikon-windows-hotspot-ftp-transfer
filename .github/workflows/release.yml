name: Build Windows exe

# Builds NikonFTPTransfer.exe on a Windows runner.
# - on every push/PR: tests + exe as build artifact
# - on a v* tag: additionally a GitHub release with the exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests
        shell: bash   # -e: stop at the first failing test (pwsh would only check the last one)
        run: |
          python tests/test_progress.py
          python tests/test_i18n.py
          python tests/test_release.py
          python tests/test_network.py

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name NikonFTPTransfer
          --icon assets/icon.ico
          --add-data "ui.html;."
          --add-data "locales;locales"
          nikon_ftp_transfer.py

      - name: Smoke test (exe starts, dashboard responds)
        shell: pwsh
        run: |
          $env:NFT_TEST = "1"; $env:NFT_NO_BROWSER = "1"
          $env:NFT_TARGET = "$env:RUNNER_TEMP\target"; $env:NFT_CONFIG = "$env:RUNNER_TEMP\config.json"
          $p = Start-Process dist\NikonFTPTransfer.exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          $r = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if ($r.Content -notmatch "Nikon FTP Transfer") { throw "Dashboard page missing" }
          $i = Invoke-RestMethod http://127.0.0.1:8765/api/i18n
          if (-not $i.strings -or @($i.strings.PSObject.Properties).Count -eq 0) { throw "/api/i18n returned no strings" }
          $st = Invoke-RestMethod http://127.0.0.1:8765/api/state
          if (-not $st.lang) { throw "/api/state has no lang field" }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8765/api/action -Body '{"action":"quit"}' | Out-Null
          Start-Sleep -Seconds 3
          if (-not $p.HasExited) { Stop-Process $p -Force }

      - uses: actions/upload-artifact@v4
        with:
          name: NikonFTPTransfer
          path: dist/NikonFTPTransfer.exe

      - name: Release name (code name from .github/release-names.json)
        id: relname
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw "Tag '$tag' is not of the form vX.Y.Z" }
          $major = $Matches[1]; $minor = [int]$Matches[2]
          $src = Get-Content nikon_ftp_transfer.py -Raw
          if ($src -notmatch 'APP_VERSION = "([^"]+)"') { throw "APP_VERSION not found" }
          if ("v$($Matches[1])" -ne $tag) { throw "Tag $tag does not match APP_VERSION $($Matches[1])" }
          $names = Get-Content .github/release-names.json -Raw | ConvertFrom-Json
          $fam = $names.$major
          if (-not $fam -or $minor -ge @($fam.names).Count) { throw "No code name for $tag in .github/release-names.json" }
          $name = @($fam.names)[$minor]
          "title=$tag $name" >> $env:GITHUB_OUTPUT
          "family=$($fam.family)" >> $env:GITHUB_OUTPUT
          Write-Host "Release title: $tag $name ($($fam.family))"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.relname.outputs.title }}
          body: "Code name family: ${{ steps.relname.outputs.family }}"
          files: dist/NikonFTPTransfer.exe
          generate_release_notes: true
