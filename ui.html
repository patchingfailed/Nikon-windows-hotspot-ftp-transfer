<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nikon FTP Transfer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Ccircle cx='13' cy='13' r='11.5' fill='%230c2330' stroke='%233987e5' stroke-width='2.4'/%3E%3Cpath d='M6 15.5c2.3-2 4.7-2 7 0s4.7 2 7 0' fill='none' stroke='%233987e5' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M7 10.5c2-1.6 4-1.6 6 0s4 1.6 6 0' fill='none' stroke='%23a0bec8' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#e8eff1;--surface:#ffffff;--surface-2:#f2f6f7;--line:#d2dfe3;--line-2:#e4ecee;
  --ink:#0f2a33;--ink-2:#3d5e68;--ink-3:#6a858e;
  --series:#2a78d6;--series-soft:rgba(42,120,214,.13);
  --good:#0a8a0a;--warn:#c98500;--crit:#d03b3b;--idle:#8a9ea5;
  --num:"Bahnschrift","DIN Alternate","DIN 2014","Barlow Semi Condensed","Segoe UI Variable Display",system-ui,sans-serif;
  --txt:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --bg:#061820;--surface:#0c2330;--surface-2:#10303e;--line:#1d4152;--line-2:#153645;
  --ink:#e2eef1;--ink-2:#a3bfc7;--ink-3:#6f909a;
  --series:#3987e5;--series-soft:rgba(57,135,229,.18);
  --good:#0ca30c;--warn:#c98500;--crit:#d03b3b;--idle:#5f7c86;
}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--txt);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--series)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--series);outline-offset:2px}
button.quiet{background:transparent}
button.stop{color:var(--crit)}
h2,h3{font-family:var(--num);font-weight:600;letter-spacing:.01em;margin:0}
h2{font-size:17px}h3{font-size:14px;color:var(--ink-2)}

/* Header */
.top{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--num);font-size:19px;font-weight:600}
.brand svg{width:26px;height:26px}
.ver{font:400 12px var(--txt);color:var(--ink-3)}
.state{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.state b{font-weight:600}.state span{color:var(--ink-2)}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

main{max-width:1240px;margin:0 auto;padding:20px 24px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.cols>*,.cols>div>*{min-width:0}
@media(max-width:700px){.top{position:static}main{padding:16px}.panel{padding:16px}.xl{font-size:64px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.ph{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ph .meta{color:var(--ink-3);font-size:13px}
.ph .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.cols{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:960px){.cols{grid-template-columns:3fr 2fr}.cols.even{grid-template-columns:1fr 1fr}}

/* Hero: dive computer display */
.hero{padding:22px 24px 14px}
.readout{display:flex;gap:36px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.gauge{display:flex;align-items:baseline;gap:10px}
.xl{font-family:var(--num);font-stretch:condensed;font-size:84px;line-height:.9;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.unit{font-family:var(--num);font-size:20px;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:4px 26px;flex:1;margin:0;min-width:300px}
.facts div{border-left:2px solid var(--line);padding-left:10px}
.facts dt{color:var(--ink-3);font-size:12.5px}
.facts dd{margin:0;white-space:nowrap;font-family:var(--num);font-size:24px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:4px 10px;background:transparent;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--series-soft);color:var(--ink);font-weight:600}
.active{display:grid;gap:6px;margin-top:6px;min-height:22px}
.active .row{display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.active .row b{font-weight:600;min-width:150px}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:35%;border-radius:2px;background:var(--series);animation:slide 1.4s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.5}}
.muted{color:var(--ink-3)}

/* Charts */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.grid{stroke:var(--line-2);stroke-width:1}
.axis{stroke:var(--line);stroke-width:1}
.axl{fill:var(--ink-3);font:11.5px var(--txt);font-variant-numeric:tabular-nums}
.axl.hl{fill:var(--ink);font-weight:600}
.ln{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--series-soft)}
.xh{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.dot{fill:var(--series);stroke:var(--surface);stroke-width:2}
.mk-warning{stroke:var(--warn)}.mk-error{stroke:var(--crit)}
.mk{stroke-width:1.5;stroke-dasharray:2 3}
.f-ok{fill:var(--series)}.f-warn{fill:var(--warn)}.f-aborted{fill:var(--crit)}
.f-dup{fill:none;stroke:var(--ink-3);stroke-width:1.5}
.f-hover{stroke:var(--ink);stroke-width:1.5}
.cb{fill:var(--series)}.cb-unk{fill:none;stroke:var(--ink-3);stroke-dasharray:2 2}
.ring{fill:none;stroke:var(--ink);stroke-width:1.5}
.empty{fill:var(--ink-3);font:13px var(--txt)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.tip{position:fixed;z-index:20;pointer-events:none;max-width:340px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,20,30,.18)}
.tip b{font-weight:600}.tip .t{color:var(--ink-3)}
.tip table{border-collapse:collapse;margin-top:4px}.tip td{padding:1px 8px 1px 0;white-space:nowrap}

/* Connection chain */
.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:0;align-items:stretch}
@media(max-width:900px){.chain{grid-template-columns:1fr}}
.node{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 14px}
.node::after{content:"";position:absolute;top:50%;right:-29px;width:28px;border-top:2px solid var(--line)}
.node.link-ok::after{border-top-color:var(--series)}
.node:last-child::after{display:none}
@media(max-width:900px){.node{margin:7px 0}.node::after{display:none}}
.nh{display:flex;align-items:center;gap:8px;font-family:var(--num);font-size:15px;font-weight:600}
.nh svg{width:20px;height:20px;stroke:var(--ink-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ns{display:flex;align-items:center;gap:6px;margin:8px 0 4px;font-weight:600}
.nd{color:var(--ink-2);font-size:12.5px;line-height:1.45;font-variant-numeric:tabular-nums;word-break:break-word}
.node.s-good{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.node.s-warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.node.s-crit{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}
.si{width:16px;height:16px;flex:none}
.node button{margin-top:8px;font-size:12.5px;padding:4px 9px}

/* Lists */
.hint{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-2)}
.hint:first-child{border-top:0;padding-top:0}
.hint .si{margin-top:2px}
.hint button{margin-top:6px;font-size:12.5px;padding:4px 9px}
.sw-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:9px 0;border-top:1px solid var(--line-2);cursor:pointer;position:relative}
.sw-row:first-of-type{border-top:0;padding-top:0}
.sw-row input{position:absolute;opacity:0;width:1px;height:1px}
.tg{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;margin-top:1px;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw-row input:checked+.tg{background:var(--series)}
.sw-row input:checked+.tg::after{transform:translateX(16px)}
.sw-row input:focus-visible+.tg{outline:2px solid var(--series);outline-offset:2px}
.sw-row input:disabled+.tg{opacity:.45}
@media (prefers-reduced-motion:reduce){.tg,.tg::after{transition:none}}
/* Progress */
.prog-wrap{margin:16px 0 4px;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2)}
.prog-form{display:grid;gap:10px}
.prog-form .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prog-form input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px;width:170px;font-variant-numeric:tabular-nums}
.prog-form input[type=text]:focus-visible{outline:2px solid var(--series);outline-offset:1px}
.prog-form .help{color:var(--ink-2);font-size:13px;max-width:72ch}
.pbar{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden;margin:10px 0 8px}
.pbar i{display:block;height:100%;border-radius:5px;background:var(--series)}
.pbar.done i{background:var(--good)}
.ptop{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.pnum{font-family:var(--num);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.peta{font-family:var(--num);font-size:20px;color:var(--ink-2)}
.ptools{margin-left:auto;display:flex;gap:6px}
.ptools button{font-size:12.5px;padding:4px 9px}
.pmeta{color:var(--ink-3);font-size:12.5px}
.alert{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid color-mix(in srgb,var(--warn) 55%,var(--line));display:grid;gap:8px}
.alert.good{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.alert .ah{display:flex;gap:8px;align-items:center;font-weight:600}
.alert .nums{font:12.5px/1.7 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--ink-2);max-height:96px;overflow:auto}
.alert .btns{display:flex;gap:8px;flex-wrap:wrap}
.err-msg{color:var(--crit);font-size:13px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:0 0 14px}
dl.kv dt{color:var(--ink-3)}dl.kv dd{margin:0}
code{word-break:break-all;font:12.5px ui-monospace,"Cascadia Mono",Consolas,monospace;background:var(--surface-2);padding:1px 6px;border-radius:5px}
.ads{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.ads li{display:grid;grid-template-columns:86px 1fr;gap:2px 10px;padding:7px 10px;border-radius:9px;background:var(--surface-2)}
.ads .k{color:var(--ink-3);font-size:12.5px}.ads .n{font-weight:600}.ads .d{grid-column:2;color:var(--ink-2);font-size:12.5px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
table.t th{text-align:left;color:var(--ink-3);font-weight:500;font-size:12px;padding:5px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.t td.n,table.t th.n{text-align:right}
.scroll{max-height:320px;overflow:auto;margin-top:8px}
details{margin-top:10px}summary{cursor:pointer;color:var(--ink-2)}
.ev{max-height:360px;font:12.5px/1.6 ui-monospace,"Cascadia Mono",Consolas,monospace;overflow:auto}
.ev div{display:grid;grid-template-columns:70px 18px 1fr;gap:6px;align-items:start}
.ev .tm{color:var(--ink-3)}
.lvl-warning{color:var(--warn)}.lvl-error{color:var(--crit)}.lvl-ok{color:var(--good)}
dialog{width:min(920px,94vw);border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px 20px}
dialog::backdrop{background:rgba(0,15,22,.5)}
textarea{width:100%;height:58vh;font:12px ui-monospace,Consolas,monospace;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px}
</style></head><body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="var(--series)" stroke-width="2"/><path d="M5 15c2.5-2 5-2 8 0s5.5 2 8 0" fill="none" stroke="var(--series)" stroke-width="2" stroke-linecap="round"/><path d="M7 10.5c2-1.5 4-1.5 6 0s4 1.5 6 0" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-linecap="round"/></svg>Nikon FTP Transfer<span class="ver" id="ver"></span></div>
  <div class="state" id="state" role="status"></div>
  <nav class="actions">
    <div class="seg" id="lang" role="group" data-i18n-aria="ui.lang.label"><button data-l="de" onclick="setLang('de')">DE</button><button data-l="en" onclick="setLang('en')">EN</button></div>
    <button onclick="act('restart_hotspot')" data-i18n="ui.act.restart_hotspot"></button>
    <button onclick="diag()" data-i18n="ui.act.diag"></button>
    <button onclick="act('open_folder')" data-i18n="ui.act.open_folder"></button>
    <button class="stop" onclick="quit()" data-i18n="ui.act.quit"></button>
  </nav>
</header>
<main>
  <section class="panel hero" data-i18n-aria="ui.hero.aria">
    <div class="readout">
      <div class="gauge"><span class="xl" id="cur">0.0</span><span class="unit">MB/s</span></div>
      <dl class="facts" id="facts"></dl>
    </div>
    <div class="prog-wrap" id="prog"></div>
    <div class="ph" style="margin:14px 0 4px"><h2 data-i18n="ui.rate.title"></h2>
      <div class="right"><div class="seg" id="win" role="group" data-i18n-aria="ui.rate.window">
        <button data-w="300" onclick="setWin(300)"></button><button data-w="900" onclick="setWin(900)"></button><button data-w="3600" onclick="setWin(3600)"></button>
      </div></div></div>
    <div class="chart" id="rate"></div>
    <div class="active" id="active"></div>
  </section>

  <section class="chain" id="chain" data-i18n-aria="ui.chain.aria"></section>

  <div class="cols">
    <div style="display:grid;gap:18px;align-content:start">
      <section class="panel"><div class="ph"><h2 data-i18n="ui.hints.title"></h2></div><div id="hints"></div></section>
      <section class="panel"><div class="ph"><h2 data-i18n="ui.events.title"></h2><span class="meta" data-i18n="ui.events.newest_first"></span></div><div class="ev" id="ev"></div></section>
    </div>
    <div style="display:grid;gap:18px;align-content:start">
    <section class="panel"><div class="ph"><h2 data-i18n="ui.power.title"></h2><span class="meta" id="batt"></span></div>
      <label class="sw-row"><input type="checkbox" id="pw-awake" onchange="setPower('awake',this.checked)"><span class="tg" aria-hidden="true"></span>
        <span><b data-i18n="ui.power.awake"></b><br><span class="muted" id="pw-awake-d"></span></span></label>
      <label class="sw-row"><input type="checkbox" id="pw-lid" onchange="setPower('lid',this.checked)"><span class="tg" aria-hidden="true"></span>
        <span><b data-i18n="ui.power.lid"></b><br><span class="muted" id="pw-lid-d" data-i18n="ui.power.lid_d"></span></span></label>
      <div id="pw-state" style="margin:10px 0 0;display:flex;gap:8px;align-items:flex-start;font-size:13px"></div>
    </section>
    <section class="panel"><div class="ph"><h2 data-i18n="ui.cam.title"></h2><span class="meta" data-i18n="ui.cam.meta"></span></div>
      <dl class="kv" id="cam"></dl>
      <div class="ph" style="margin:4px 0 0"><h3 data-i18n="ui.ads.title"></h3></div><ul class="ads" id="ads"></ul>
    </section>
    </div>
  </div>

  <section class="panel">
    <div class="ph"><h2 data-i18n="ui.ch.title"></h2><span class="meta" id="scanmeta"></span>
      <div class="right"><button onclick="act('scan_now')" data-i18n="ui.act.scan_now"></button></div></div>
    <div class="cols even">
      <div><h3 data-i18n="ui.band.24"></h3><div class="chart" id="ch24"></div></div>
      <div><h3 data-i18n="ui.band.5"></h3><div class="chart" id="ch5"></div></div>
    </div>
    <p class="muted" style="margin:8px 0 0;font-size:12.5px" data-i18n="ui.ch.note"></p>
    <details><summary id="netsum"></summary><div class="scroll"><table class="t" id="netlist"></table></div></details>
  </section>

  <section class="panel">
    <div class="ph"><h2 data-i18n="ui.files.title"></h2><span class="meta" data-i18n="ui.files.meta"></span>
      <div class="right legend">
        <span><i class="sw" style="background:var(--series)"></i><span data-i18n="ui.st.ok"></span></span>
        <span><i class="sw" style="background:var(--warn)"></i><span data-i18n="ui.st.warn"></span></span>
        <span><i class="sw" style="background:var(--crit)"></i><span data-i18n="ui.st.aborted"></span></span>
        <span><i class="sw" style="border:1.5px solid var(--ink-3)"></i><span data-i18n="ui.legend.dup"></span></span>
      </div></div>
    <div class="chart" id="fbars"></div>
    <details><summary data-i18n="ui.files.table"></summary><div class="scroll"><table class="t"><thead><tr><th data-i18n="ui.th.time"></th><th data-i18n="ui.th.file"></th><th class="n">MB</th><th class="n">s</th><th class="n">MB/s</th><th data-i18n="ui.th.status"></th><th data-i18n="ui.th.note"></th></tr></thead><tbody id="tbl"></tbody></table></div></details>
  </section>

</main>
<div class="tip" id="tip" hidden></div>
<dialog id="dlg"><div class="ph"><h2 data-i18n="ui.diag.title"></h2><span class="meta" id="dpath"></span></div>
  <textarea id="dtext" readonly></textarea>
  <p style="display:flex;gap:8px;margin:12px 0 0"><button onclick="navigator.clipboard.writeText($('dtext').value)" data-i18n="ui.diag.copy"></button><button class="quiet" onclick="$('dlg').close()" data-i18n="ui.diag.close"></button></p></dialog>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Translation layer: strings come from /api/i18n (current language, English fallback merged in) */
let STR={}, LANGC='en', LOC='en-GB', nf1, nf2;
const t=(k,p)=>{let s=STR[k]??k;if(p)for(const n in p)s=s.split('{'+n+'}').join(p[n]);return s};
const f1=x=>nf1.format(x||0), f2=x=>nf2.format(x||0);
const clock=ts=>new Date(ts*1000).toLocaleTimeString(LOC);
const hm=ts=>new Date(ts*1000).toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'});
const dur=s=>{s=Math.floor(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} h ${m} min`:`${m} min`};
const ago=ts=>{if(!ts)return '';const s=Math.max(0,Math.round(D.now-ts));return s<60?t('ui.ago_s',{n:s}):t('ui.ago_min',{n:Math.round(s/60)})};
const cnt=(n,one,other)=>t(n===1?one:other,{n});
function setLocale(lang){LANGC=lang;LOC=lang==='de'?'de-DE':'en-GB';
  nf1=new Intl.NumberFormat(LOC,{minimumFractionDigits:1,maximumFractionDigits:1});
  nf2=new Intl.NumberFormat(LOC,{minimumFractionDigits:2,maximumFractionDigits:2});
  document.documentElement.lang=lang}
setLocale('en');
function applyStatic(){

function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const s of [1,2,2.5,5,10])if(s*p>=v)return s*p;return 10*p}

/* Throughput curve */
function renderRate(){
  const el=$('rate'),W=el.clientWidth||700,H=220,m={l:40,r:14,t:16,b:26};
  const now=D.now,x0=now-WIN,pts=D.rate_hist.filter(p=>p[0]>=x0-2);
  const mx=Math.max(5,...pts.map(p=>p[1]));const st=niceStep(mx/4);const ym=Math.ceil(mx*1.08/st)*st;
  const X=t=>m.l+(t-x0)/WIN*(W-m.l-m.r),Y=v=>H-m.b-v/ym*(H-m.t-m.b);
  let s=svgOpen(W,H);
  for(let v=0;v<=ym+1e-9;v+=st){s+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axl" x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${v%1?f1(v):v}</text>`}
  const xs=WIN<=300?60:WIN<=900?180:600;
  for(let t=Math.ceil(x0/xs)*xs;t<=now;t+=xs){s+=`<text class="axl" x="${X(t)}" y="${H-7}" text-anchor="middle">${hm(t)}</text>`}
  const segs=[];let c=[];for(const p of pts){if(c.length&&p[0]-c[c.length-1][0]>4){segs.push(c);c=[]}c.push(p)}if(c.length)segs.push(c);
  for(const g of segs){const L=g.map(p=>`${X(Math.max(p[0],x0)).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('L');
    s+=`<path class="ar" d="M${X(Math.max(g[0][0],x0)).toFixed(1)},${Y(0)}L${L}L${X(g[g.length-1][0]).toFixed(1)},${Y(0)}Z"/><path class="ln" d="M${L}"/>`}
  const mks=D.events.filter(e=>(e.level==='warning'||e.level==='error')&&e.ts>=x0);
  for(const e of mks){const x=X(e.ts);s+=`<line class="mk mk-${e.level}" x1="${x}" x2="${x}" y1="${m.t}" y2="${H-m.b}"/>${e.level==='error'?`<path d="M${x-4},${m.t-2}l4,-6l4,6z" fill="var(--crit)"/>`:`<path d="M${x-4},${m.t-2}l4,-6l4,6z" fill="var(--warn)"/>`}`}
  s+=`<line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  if(!pts.some(p=>p[1]>0.05))s+=`<text class="empty" x="${(W+m.l)/2}" y="${H/2}" text-anchor="middle">${esc(t('ui.rate.empty'))}</text>`;
  const h=HOV.rate;let th='';
  if(h){const r=el.getBoundingClientRect(),rx=h.x-r.left;
    if(rx>=m.l&&rx<=W-m.r){const t=x0+(rx-m.l)/(W-m.l-m.r)*WIN;let best=null,bd=1e9;for(const p of pts){const d=Math.abs(p[0]-t);if(d<bd){bd=d;best=p}}
      const near=mks.filter(e=>Math.abs(X(e.ts)-rx)<7);
      if(best&&bd<5){s+=`<line class="xh" x1="${X(best[0])}" x2="${X(best[0])}" y1="${m.t}" y2="${H-m.b}"/><circle class="dot" cx="${X(best[0])}" cy="${Y(best[1])}" r="4.5"/>`;th=`<span class="t">${clock(best[0])}</span><br><b>${f1(best[1])} MB/s</b>`}
      else th=`<span class="t">${clock(t)}</span><br>${esc(t('ui.rate.none'))}`;
      if(near.length)th+=near.map(e=>`<div style="margin-top:6px">${ICON[LVL[e.level]]} ${esc(e.msg)}</div>`).join('')}}
  el.innerHTML=s+'</svg>';
  if(h&&th)showTip(th,h.x,h.y);
}

  const cap=Math.max(20,Math.floor((W-m.l-m.r)/9));const fs=D.files.slice(0,cap).reverse();

  const mx=Math.max(5,...fs.map(f=>f.mbps||0));const st=niceStep(mx/3);const ym=Math.ceil(mx*1.08/st)*st;
  const Y=v=>H-m.b-v/ym*(H-m.t-m.b),base=Y(0),slot=(W-m.l-m.r)/Math.max(fs.length,cap);

  const h=HOV.fbars;let hi=-1;if(h){const r=el.getBoundingClientRect();hi=Math.floor((h.x-r.left-m.l)/slot)}

  else if(h)tip.hidden=true;
}

async function saveExpect(){const v=$('pval').value,f=$('pfirst')?$('pfirst').value:'';
  const r=await (await fetch('/api/action',{method:'POST',body:JSON.stringify({action:'expect',mode:pmode,value:v,first:f})})).json();
  if(r.ok){pedit=false;perr=''}else perr=r.msg;await tick();renderProg(true)}
async function pAct(a,v){await fetch('/api/action',{method:'POST',body:JSON.stringify({action:a,value:v})});await tick();renderProg(true)}
function renderProg(force){
  const p=D.progress||{},box=$('prog');
  const focused=box.contains(document.activeElement)&&document.activeElement.tagName==='INPUT';
  if(focused&&!force)return;
  const sess=esc(t('ui.prog.session',{files:p.session_files||0,images:p.session_images||0,since:p.session_start?clock(p.session_start):'-'}));
  const PMS=pm();
  if(!p.mode||pedit){box.innerHTML=progForm(p)+`<p class="pmeta" style="margin:10px 0 0">${sess}</p>`;return}
  if(p.waiting){box.innerHTML=`<div class="ptop"><span class="pnum">${esc(PMS[p.mode].l)}: ${esc(p.mode==='last'?fmtNum(p.prefix,p.value):p.value)}</span>
    <div class="ptools"><button onclick="pedit=true;pmode='${p.mode}';renderProg(true)">${esc(t('ui.prog.change'))}</button><button class="quiet" onclick="pAct('expect_clear')">${esc(t('ui.prog.remove'))}</button></div></div>
    <p class="pmeta">${esc(t('prog.waiting.'+p.waiting))}</p><p class="pmeta">${sess}</p>`;return}
  const pct=p.total?Math.min(100,p.done/p.total*100):0, done=p.state==='complete';
  const eta=done?t('ui.prog.done'):p.state==='stalled'?t('ui.prog.no_transfer'):fmtEta(p.eta_s)||t('ui.prog.calculating');
  const range=p.first!=null?t('ui.prog.range',{first:fmtNum(p.prefix,p.first),last:fmtNum(p.prefix,p.last)}):'';
  const imgs=p.unit==='images';
  let h=`<div class="ptop"><span class="pnum">${esc(imgs?t('ui.prog.count_images',{done:p.done,total:p.total}):t('ui.prog.count_files',{done:p.done,total:p.total}))}</span><span class="peta">${esc(eta)}</span>
    <div class="ptools"><button onclick="pedit=true;pmode='${p.mode}';renderProg(true)">${esc(t('ui.prog.change'))}</button><button class="quiet" onclick="pAct('expect_clear')">${esc(t('ui.prog.remove'))}</button><button class="quiet" onclick="newSession()">${esc(t('ui.prog.new_session'))}</button></div></div>
    <div class="pbar${done?' done':''}" role="progressbar" aria-valuemin="0" aria-valuemax="${p.total}" aria-valuenow="${p.done}"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="pmeta">${esc(PMS[p.mode].l)}: ${esc(p.mode==='last'?fmtNum(p.prefix,p.value):p.value)}${range?` · ${esc(t('ui.prog.range_label',{range}))}`:''}${p.anchor?` ${esc(t('ui.prog.start',{anchor:t('prog.anchor.'+p.anchor)}))}`:''}${p.direction?` · ${esc(p.direction==='up'?t('ui.prog.dir_up'):t('ui.prog.dir_down'))}`:''}${p.extra?` · ${esc(t('ui.prog.extra_more',{n:p.extra}))}`:''}</div>
    <div class="pmeta">${sess}</div>`;
  for(const n of (p.notes||[]))h+=`<div class="alert"><div class="ah">${ICON.warn}${esc(t('prog.note.'+n.code,n.params))}</div></div>`;
  const miss=(p.missing||[]).map(n=>fmtNum(p.prefix,n)), more=p.missing_more?' '+t('ui.prog.more',{n:p.missing_more}):'';
  if(done&&!p.extra){h+=`<div class="alert good"><div class="ah">${ICON.good}${esc(imgs?t('ui.prog.all_images',{total:p.total}):t('ui.prog.all_files',{total:p.total}))}</div></div>`}
  else if(done&&p.extra){h+=`<div class="alert good"><div class="ah">${ICON.good}${esc(imgs?t('ui.prog.done_extra_images',{extra:p.extra}):t('ui.prog.done_extra_files',{extra:p.extra}))}</div><div class="pmeta">${esc(t('ui.prog.extra_hint'))}</div></div>`}
  else if(p.state==='stalled'&&p.ack!=='ok'){
    const missTxt=p.mode==='files'?t('ui.prog.stalled_files',{n:p.remaining}):t('ui.prog.stalled_images',{n:p.remaining});
    h+=`<div class="alert"><div class="ah">${ICON.warn}${esc(missTxt)}</div>
      ${miss.length?`<div class="pmeta">${esc(p.mode==='card'?t('ui.prog.gaps'):t('ui.prog.missing_nums'))}</div><div class="nums">${miss.join(', ')}${esc(more)}</div>`:''}
      ${p.ack==='missing'?`<div class="pmeta">${esc(t('ui.prog.flagged'))}</div>
        <div class="btns"><button onclick="navigator.clipboard.writeText('${miss.join(', ')}')">${esc(t('ui.prog.copy_list'))}</button><button class="quiet" onclick="pAct('expect_ack','ok')">${esc(t('ui.prog.actually_fine'))}</button></div>`
      :`<div class="btns"><button onclick="pAct('expect_ack','ok')">${esc(t('ui.prog.fine_deleted'))}</button><button onclick="pAct('expect_ack','missing')">${esc(t('ui.prog.upload_again'))}</button></div>`}</div>`}
  if(p.bad&&p.bad.length)h+=`<div class="alert"><div class="ah">${ICON.warn}${esc(t('ui.prog.bad',{list:p.bad.map(n=>fmtNum(p.prefix,n)).join(', ')}))}</div><div class="pmeta">${esc(t('ui.prog.bad_hint'))}</div></div>`;
  box.innerHTML=h;
}
function render(){
  const s=D.stats;$('cur').textContent=f1(s.cur_mbps);
  const facts=[[t('ui.fact.avg'),`${f1(s.avg_mbps)} MB/s`],[t('ui.files.title'),s.files],[t('ui.fact.volume'),`${f2(s.bytes/1e9)} GB`],
    [t('ui.fact.uptime'),dur(s.uptime)],[t('ui.fact.dups'),s.dups],[t('ui.fact.warn_aborted'),`${s.warn} / ${s.aborted}`]];
  $('facts').innerHTML=facts.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('');
  $('active').innerHTML=D.active.map(a=>`<div class="row"><b>${esc(a.name)}</b><span>${f1(a.size/1e6)} MB</span><span>${f1(a.mbps)} MB/s</span><div class="bar"><i></i></div></div>`).join('')||`<span class="muted">${esc(t('ui.active.none'))}</span>`;
  renderProg(false);renderState();renderRate();renderChain();renderFiles();renderCh('ch24',CH24,true);renderCh('ch5',CH5,false);renderPower();
  $('hints').innerHTML=D.hints.map(h=>`<div class="hint">${ICON[LVL[h.level]]}<div>${esc(h.text)}${h.action?`<br><button onclick="act('${h.action}')">${esc(h.action==='loopback_enable'?t('ui.act.loopback_enable'):t('ui.act.loopback_wizard'))}</button>`:''}</div></div>`).join('')||`<div class="hint">${ICON.good}<div>${esc(t('ui.hints.none'))}</div></div>`;
  const c=D.config;$('cam').innerHTML=[[t('ui.cam.ssid'),c.ssid],[t('ui.cam.password'),(D.net.hotspot||{}).passphrase||t('ui.cam.passphrase_hint')],[t('ui.cam.band'),t('ui.band.5')],[t('ui.cam.server'),c.ip],[t('ui.cam.port'),c.port],[t('ui.cam.pasv'),'ON'],[t('ui.cam.user'),c.user],[t('ui.cam.ftp_password'),c.password],[t('ui.cam.target'),c.target]].map(([k,v])=>`<dt>${esc(k)}</dt><dd><code>${esc(v)}</code></dd>`).join('');
  const KIND={wifi:t('ui.kind.wifi'),ethernet:t('ui.kind.ethernet'),vpn:t('ui.kind.vpn'),loopback:t('ui.kind.loopback'),hotspot:t('ui.word.hotspot'),bluetooth:t('ui.kind.bluetooth'),other:t('ui.kind.other')};
  const ASTAT={Up:t('ui.adapter.up'),Disconnected:t('ui.adapter.disconnected'),Disabled:t('ui.adapter.disabled'),'Not Present':t('ui.adapter.not_present')};
  const ads=(D.net.adapters||[]);const srcName=(D.net.share_source||{}).name;
  $('ads').innerHTML=ads.length?ads.map(a=>`<li><span class="k">${esc(KIND[a.kind]||a.kind)}</span><span class="n">${esc(a.name)} <span class="muted" style="font-weight:400">${esc(ASTAT[a.status]||a.status)}</span></span><span class="d">${esc(a.desc)}${a.ipv4&&a.ipv4.length?`<br>${a.ipv4.map(esc).join(', ')}`:''}${a.profile?`<br>${esc(a.profile.name)}: ${a.profile.v4==='Internet'?esc(t('ui.st.internet')):esc(a.profile.v4)}${a.profile.name===srcName?esc(', '+t('ui.ads.share_source')):''}`:''}</span></li>`).join(''):`<li><span class="k">–</span><span class="d">${esc(D.test_mode?t('ui.ads.none_test'):t('ui.ads.none'))}</span></li>`;
  const sc=D.scan||{},nets=(sc.networks||[]).slice().sort((a,b)=>(b.signal||0)-(a.signal||0));
  $('scanmeta').textContent=D.scan_error?t('ui.scan.error',{error:D.scan_error}):D.scan_ts?t('ui.scan.meta',{iface:sc.iface,ago:ago(D.scan_ts)})+(sc.fresh===false?', '+t('ui.scan.cached'):''):'';
  $('netsum').textContent=t('ui.netlist',{n:nets.length});
  $('netlist').innerHTML=`<thead><tr><th>SSID</th><th>BSSID</th><th>${esc(t('ui.th.band'))}</th><th class="n">${esc(t('ui.th.channel'))}</th><th class="n">${esc(t('ui.th.signal'))}</th><th class="n">${esc(t('ui.th.usage'))}</th><th class="n">${esc(t('ui.th.stations'))}</th></tr></thead><tbody>${nets.map(n=>`<tr><td>${esc(n.ssid||t('ui.hidden'))}</td><td>${esc(n.bssid)}</td><td>${esc(n.band)}</td><td class="n">${n.channel??''}</td><td class="n">${n.signal??''} %</td><td class="n">${n.util!=null?n.util+' %':''}</td><td class="n">${n.stations??''}</td></tr>`).join('')}</tbody>`;
  $('tbl').innerHTML=D.files.map(x=>`<tr><td>${clock(x.ts)}</td><td>${esc(x.name)}</td><td class="n">${f1(x.size/1e6)}</td><td class="n">${f1(x.secs)}</td><td class="n">${f1(x.mbps)}</td><td>${esc(stName(x.status))}</td><td>${esc(x.note)}</td></tr>`).join('');
  $('ev').innerHTML=D.events.map(e=>`<div><span class="tm">${clock(e.ts)}</span><span>${ICON[LVL[e.level]]||''}</span><span class="lvl-${e.level}">${esc(e.msg)}</span></div>`).join('');
}
let dead=0;
async function tick(){try{D=await (await fetch('/api/state')).json();dead=0;if(D.lang&&D.lang!==LANGC)await loadI18n();$('ver').textContent=D.version?`v${D.version} ${D.codename||''}`.trim():'';render()}catch(e){if(++dead>2)$('state').innerHTML=`${ICON.crit}<b>${esc(t('ui.dead.title'))}</b><span>${esc(t('ui.dead.sub'))}</span>`}}
function renderPower(){
  const p=D.power||{},b=p.battery;
  const aw=$('pw-awake'),ld=$('pw-lid');
  if(document.activeElement!==aw)aw.checked=!!p.awake;
  if(document.activeElement!==ld)ld.checked=!!p.lid;
  aw.disabled=ld.disabled=!p.supported&&!D.test_mode;
  $('batt').textContent=b?(b.ac?t('ui.power.battery_ac',{n:b.percent}):t('ui.power.battery_bat',{n:b.percent})):'';
  const im=p.idle_min;
  $('pw-awake-d').textContent=im?t('ui.power.awake_d',{min:im}):t('ui.power.awake_d_run');
  let ic='idle',msg;
  if(!p.supported&&!D.test_mode){msg=t('ui.power.unsupported')}
  else if(!p.awake&&!p.lid){msg=t('ui.power.normal')}
  else if(D.active.length){ic='good';msg=t('ui.power.active')}
  else if(p.left==null){ic='good';msg=t('ui.power.awake_running')}
  else if(p.left>0){ic='good';const m=Math.floor(p.left/60),sec=String(p.left%60).padStart(2,'0');
    msg=t('ui.power.idle_left',{since:clock(p.last_activity),m,s:sec})}
  else{ic='info';msg=t('ui.power.paused',{since:clock(p.last_activity+im*60)})}
  if(p.lid_eff&&p.lid_orig_text)msg+=' '+t('ui.power.lid_note',{text:p.lid_orig_text});
  if(p.error){ic='crit';msg+=' '+p.error}
  $('pw-state').innerHTML=`${ICON[ic]}<span>${esc(msg)}</span>`;
}
